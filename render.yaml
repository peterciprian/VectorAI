services:
  - type: web
    name: vectoryai-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vectoryai-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: vectoryai-keyvalue
          type: keyvalue
          property: connectionString
      - key: STORAGE_ROOT
        value: /tmp/project_storage
      - key: CORS_ORIGINS
        value: https://peterciprian.github.io/VectorAI

  - type: keyvalue
    name: vectoryai-keyvalue
    plan: free
    region: frankfurt
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # Render does not currently offer free background workers.
  # Add this service only after selecting a paid worker plan:
  #
  # - type: worker
  #   name: vectoryai-worker
  #   runtime: docker
  #   plan: 0.5c-512mb
  #   region: frankfurt
  #   dockerfilePath: ./apps/worker/Dockerfile
  #   dockerContext: ./apps/worker
  #   dockerCommand: celery -A app.celery_app.celery_app worker --loglevel=INFO --concurrency=1
  #   envVars:
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: vectoryai-postgres
  #         property: connectionString
  #     - key: REDIS_URL
  #       fromService:
  #         name: vectoryai-keyvalue
  #         type: keyvalue
  #         property: connectionString
  #     - key: STORAGE_ROOT
  #       value: /tmp/project_storage

databases:
  - name: vectoryai-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: '16'
    databaseName: vectoryai
    user: vectoryai
    diskSizeGB: 1
    ipAllowList: []
